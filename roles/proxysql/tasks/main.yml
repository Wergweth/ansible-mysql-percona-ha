---
- name: Look for the package in the artifacts directory
  ansible.builtin.stat:
    path: "{{ lab_artifacts_dir }}/{{ proxysql_deb_file }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: proxysql_deb_local

- name: The package from artifacts matches the expected SHA256
  ansible.builtin.assert:
    that: proxysql_deb_local.stat.checksum == proxysql_deb_sha256
    fail_msg: "{{ lab_artifacts_dir }}/{{ proxysql_deb_file }}: SHA256 does not match proxysql_deb_sha256"
    quiet: true
  when: proxysql_deb_local.stat.exists

- name: Copy the package from artifacts to the node
  ansible.builtin.copy:
    src: "{{ lab_artifacts_dir }}/{{ proxysql_deb_file }}"
    dest: "/var/tmp/{{ proxysql_deb_file }}"
    mode: "0644"
  when: proxysql_deb_local.stat.exists

- name: Download the package from GitHub
  when: not proxysql_deb_local.stat.exists
  block:
    - name: Download {{ proxysql_deb_file }}
      ansible.builtin.get_url:
        url: "{{ proxysql_deb_url }}"
        dest: "/var/tmp/{{ proxysql_deb_file }}"
        checksum: "sha256:{{ proxysql_deb_sha256 }}"
        mode: "0644"
        timeout: 60
      register: proxysql_deb_download
      retries: 3
      delay: 10
      until: proxysql_deb_download is succeeded

  rescue:
    - name: Tell where to get the package
      ansible.builtin.fail:
        msg: >-
          Failed to download {{ proxysql_deb_url }}.
          Download the package where GitHub is reachable and put it into {{ lab_artifacts_dir }}/

- name: Install the package
  ansible.builtin.apt:
    deb: "/var/tmp/{{ proxysql_deb_file }}"
  register: proxysql_install
  retries: 20
  delay: 15
  until: proxysql_install is succeeded

- name: Bootstrap config
  ansible.builtin.template:
    src: proxysql.cnf.j2
    dest: /etc/proxysql.cnf
    owner: root
    group: proxysql
    mode: "0640"
  notify:
    - Reinitialize proxysql
    - Apply proxysql config

- name: Admin interface credentials
  ansible.builtin.template:
    src: proxysql-admin.cnf.j2
    dest: /root/.proxysql-admin.cnf
    owner: root
    group: root
    mode: "0600"

- name: Desired routing state
  ansible.builtin.template:
    src: proxysql-config.sql.j2
    dest: /etc/proxysql-ansible.sql
    owner: root
    group: root
    mode: "0600"
  notify: Apply proxysql config

- name: Script to view backend roles
  ansible.builtin.copy:
    dest: /usr/local/bin/proxysql-roles
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Backend roles in ProxySQL: proxysql-roles
      exec mysql --defaults-file=/root/.proxysql-admin.cnf -t -e \
        "SELECT hostgroup_id AS hg, hostname, status, weight FROM runtime_mysql_servers ORDER BY 1, 2"

- name: ProxySQL service is started
  ansible.builtin.systemd_service:
    name: proxysql
    state: started
    enabled: true

- name: Apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Read backend roles
  ansible.builtin.command: /usr/local/bin/proxysql-roles
  register: proxysql_runtime
  changed_when: false
  retries: 10
  delay: 2
  until: proxysql_runtime.stdout is search('\|\s*' ~ proxysql_writer_hostgroup ~ '\s*\|')

- name: Backends in runtime
  ansible.builtin.debug:
    var: proxysql_runtime.stdout_lines
