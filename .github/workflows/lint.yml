---
name: lint

"on":
  push:
  pull_request:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ansible-core, ansible-lint, yamllint
        run: pip install ansible-core ansible-lint yamllint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Dummy vault password
        # ansible.cfg points to .vault_pass; secrets are not needed for syntax checks
        run: echo ci > .vault_pass

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
