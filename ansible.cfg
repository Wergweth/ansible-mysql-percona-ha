[defaults]
# Default variant is A (async + semi-sync). Variant B: -i inventories/pxc.yml
inventory            = inventories/async.yml
roles_path           = ./roles
vault_password_file  = .vault_pass
retry_files_enabled  = False
result_format        = yaml
callbacks_enabled    = ansible.posix.profile_tasks
interpreter_python   = auto_silent
forks                = 10
# handlers run even if the play fails later: otherwise a config change
# made before the failure would not be applied on the next run either
force_handlers       = True

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s
